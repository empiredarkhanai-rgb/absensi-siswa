<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Face Recognition</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background: #f4f7f6; padding: 15px; margin: 0; }
    .container { max-width: 450px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    #webcam { width: 100%; border-radius: 8px; background: #000; transform: scaleX(-1); }
    .status-box { margin-top: 15px; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 14px; word-break: break-word; }
    .info { background: #e2e3e5; color: #383d41; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>

  <!-- Library Face API -->
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>
<body>

<div class="container">
  <h3>Absensi Siswa Real-Time</h3>
  <video id="webcam" autoplay muted playsinline></video>
  <div id="status" class="status-box info">Mempersiapkan sistem...</div>
</div>

<script>
  // 1. URL Web App Google Apps Script Anda
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw8-69fXNFesQTgOyaRmWhSoUzU-l6NZzfBH-5ysV90m-9-YJQINuoK5xdoS5WOvPXY0g/exec";

  // 2. Daftar Siswa dan Jalur Foto Referensi
  const DAFTAR_SISWA = [
    { id: "SISWA-001", nama: "Budi", foto: "foto_siswa/SISWA-001.jpg" },
    { id: "SISWA-002", nama: "Siti", foto: "foto_siswa/SISWA-002.jpg" },
    { id: "SISWA-003", nama: "Ani",  foto: "foto_siswa/SISWA-003.jpg" }
  ];

  const video = document.getElementById('webcam');
  const statusDiv = document.getElementById('status');
  let isProcessing = false;
  let faceMatcher = null;

  function setStatus(text, className = 'info') {
    statusDiv.className = `status-box ${className}`;
    statusDiv.innerText = text;
  }

  // Buka Akses Kamera Depan
  async function setupCamera() {
    setStatus("Meminta izin kamera...");
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
      });
      video.srcObject = stream;
      return new Promise((resolve) => { video.onloadedmetadata = () => resolve(video); });
    } catch (err) {
      throw new Error("Kamera ditolak/tidak terdeteksi: " + err.message);
    }
  }

  // Muat Foto Referensi Siswa untuk Pencocokan Wajah
  async function loadStudentDescriptors() {
    setStatus("Memuat database foto siswa...");
    
    const labeledDescriptors = await Promise.all(
      DAFTAR_SISWA.map(async (siswa) => {
        try {
          const img = await faceapi.fetchImage(siswa.foto);
          const detection = await faceapi.detectSingleFace(img)
            .withFaceLandmarks()
            .withFaceDescriptor();
            
          if (!detection) {
            console.warn(`Wajah tidak terdeteksi pada foto: ${siswa.nama}`);
            return null;
          }
          return new faceapi.LabeledFaceDescriptors(siswa.id, [detection.descriptor]);
        } catch (e) {
          console.error(`Gagal memuat foto ${siswa.nama}:`, e);
          return null;
        }
      })
    );

    // Filter foto yang berhasil dibaca
    const validDescriptors = labeledDescriptors.filter(d => d !== null);
    if (validDescriptors.length === 0) {
      throw new Error("Tidak ada foto siswa yang berhasil terbaca!");
    }

    // Buat matcher dengan ambang batas (threshold) kecocokan 0.6
    faceMatcher = new faceapi.FaceMatcher(validDescriptors, 0.6);
  }

  // Inisialisasi Seluruh Sistem
  async function init() {
    try {
      await setupCamera();
      
      setStatus("Kamera aktif. Memuat AI Model...");
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
      
      // Unduh model AI yang dibutuhkan
      await Promise.all([
        faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
      ]);

      await loadStudentDescriptors();

      setStatus("Siap! Arahkan wajah ke kamera.", "success");
      startDetection();
    } catch (error) {
      setStatus("Error: " + error.message, "error");
    }
  }

  // Jalankan Deteksi dan Pengenalan Wajah Berulang
  function startDetection() {
    setInterval(async () => {
      if (isProcessing || !faceMatcher) return;

      try {
        // Cari wajah di depan kamera HP
        const detection = await faceapi.detectSingleFace(video)
          .withFaceLandmarks()
          .withFaceDescriptor();

        if (detection) {
          // Mencocokkan wajah di kamera dengan database
          const bestMatch = faceMatcher.findBestMatch(detection.descriptor);

          if (bestMatch.label !== 'unknown') {
            isProcessing = true;
            const matchedStudentId = bestMatch.label;
            
            setStatus(`Wajah Dikenali [ID: ${matchedStudentId}]. Mengirim data...`, "info");
            sendAttendance(matchedStudentId);
          } else {
            setStatus("Wajah tidak terdaftar di database!", "error");
          }
        }
      } catch (e) {
        console.error("Error deteksi:", e);
      }
    }, 1500);
  }

  // Kirim Hasil Absensi ke Google Apps Script
  async function sendAttendance(studentId) {
    try {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ studentId: studentId })
      });

      const result = await response.json();

      if (result.success) {
        setStatus(" " + result.message, "success");
      } else {
        setStatus(" " + result.message, "error");
      }

      // Beri jeda 4 detik sebelum dapat memproses siswa selanjutnya
      setTimeout(() => {
        isProcessing = false;
        setStatus("Siap untuk siswa berikutnya...", "info");
      }, 4000);

    } catch (err) {
      setStatus("Gagal mengirim absensi: " + err.message, "error");
      setTimeout(() => { isProcessing = false; }, 3000);
    }
  }

  window.onload = init;
</script>

</body>
</html>
